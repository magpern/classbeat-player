[project]
name = "player-backend"
version = "0.1.0"
description = "Class player backend: accounts, class library, devices, source and player API (ADR 0002)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.137.2,<1",
  "uvicorn>=0.32,<1",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  # The class format's validators (ADR 0003, section 4): the contract lane's package, as it is.
  "classformat",
  # Passkeys (ADR 0002, section 4): the WebAuthn verification library, pinned.
  "webauthn==3.0.1",
  # The live WebSocket (ADR 0002, section 8): the server side uvicorn serves it with.
  "websockets>=15,<17",
]

[tool.uv.sources]
classformat = { path = "../schema/python" }

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
  "ruff>=0.8",
  "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/player_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# S608: SQL built from strings (ADR 0002, section 9, item 1). An error like every other rule.
select = ["E", "F", "W", "I", "B", "UP", "S608", "S105", "S106", "S107"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures build throwaway passwords and role names at run time.
"tests/**" = ["S105", "S106"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
