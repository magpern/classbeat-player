<header class="rail"><span class="val" data-tier="minor"><span class="d">2</span><span class="d">3</span>:<span class="d">4</span><span class="d">1</span></span><span class="lbl" data-tier="label">left</span><span class="val" data-tier="minor"><span class="d">1</span><span class="d">8</span>:<span class="d">1</span><span class="d">9</span></span><span class="lbl" data-tier="label">done</span><span class="lbl seg" data-tier="label" data-clamp="1">Main set</span><span class="link" data-tier="label">Following Spotify</span></header><section class="join" aria-label="Join codes">

    <div class="body">
      <h1 data-tier="value">Join the class</h1>
      
      <p class="how"><span data-tier="minor" data-lines="2">Scan with your phone’s camera.</span></p>
      <div><span class="lbl" data-tier="label">Class code</span><span class="code-big n" data-tier="value">KXPD-RMTB</span></div>

    </div>
  </div>
  <div class="card instr">
    <img class="qr-instr" src="qr-placeholder.svg" alt="QR code for the instructor: https://classbeat.example/control#KXPD-RMTB">
    <div class="itext"><h2 data-tier="minor" data-lines="2">Instructor’s phone</h2>

  </div>
