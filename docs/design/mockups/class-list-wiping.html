<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Class list: clearing saved classes</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="class-list.css">
</head>
<body>
<!-- State: wipePending: an unpairing or an account change is deleting the cache. Nothing lists, nothing starts, nothing syncs until the edge reports the wipe done. Spec: docs/design/class-list.md. The instructor's own window, read at arm's length. -->
<div class="app">
<header class="head">
  <div class="title"><h1 data-tier="minor" data-min-cap="28">Classes</h1></div>
  <button><span data-tier="minor" data-min-cap="12">Open a class file…</span> <span data-tier="label" data-min-cap="9.5" class="kbd">Ctrl+O</span></button>
</header><div class="status"><div class="what"><span class="mark work" aria-hidden="true"></span><div><span data-tier="minor" data-min-cap="14" class="st">Clearing the saved classes</span><div><span data-tier="minor" data-min-cap="11" data-lines="2" class="dt">This computer was unpaired. The classes saved here are being removed.</span></div></div></div></div><section class="panel"><h2 class="n" data-tier="minor" data-min-cap="28">One moment</h2><p data-tier="minor" data-min-cap="14" data-lines="2">Nothing can start until this is done. You can still open a class file.</p></section>
</div>
</body>
</html>
