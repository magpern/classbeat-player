<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Class list: a field was left empty</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="class-list.css">
<link rel="stylesheet" href="swedebeat-list.css">
</head>
<body>
<!-- State: sw-form-missing. Connect was pressed with a field empty. The plate names the empty fields, lowercased, in the form's order ("a", "a and b", "a, b and c"); nothing was read or sent. Fields already filled stay as typed. With many fields the plate stays within three lines (W6). Spec: docs/design/swedebeat.md. Generated by swedebeat-pages.js. -->
<div class="app">
<header class="head">
  <div class="title"><h1 data-tier="minor" data-min-cap="28">Classes</h1><span data-tier="minor" data-min-cap="11" class="count">12 classes</span></div>
  <button><span data-tier="minor" data-min-cap="12">Open a class file…</span> <span data-tier="label" data-min-cap="9.5" class="kbd">Ctrl+O</span></button>
</header><div class="status"><div class="what"><span class="mark ok" aria-hidden="true"></span><div><span data-tier="minor" data-min-cap="14" class="st">Up to date</span><div><span data-tier="minor" data-min-cap="11" data-lines="2" class="dt">Paired as ana@example.com, “Studio PC”</span></div></div></div></div><div class="plate second" role="alert"><div><span data-tier="minor" data-min-cap="14" data-lines="2" class="st">Type your password</span><div><span data-tier="minor" data-min-cap="11" data-lines="3" class="dt">Every field is needed to connect. Nothing was sent.</span></div></div><div class="row-btns" style="display:flex;gap:12px"></div></div><section class="panel"><h2 class="n" data-tier="minor" data-min-cap="28">Connect Swedebeat</h2><div class="fields"><div class="field-box"><span data-tier="label" data-min-cap="9.5" class="lbl">Username</span><div class="in focus"><span data-tier="minor" data-min-cap="13" data-lines="1">ana.k</span></div></div><div class="field-box"><span data-tier="label" data-min-cap="9.5" class="lbl">Password</span><div class="in"></div></div></div><div class="row-btns"><button class="primary"><span data-tier="minor" data-min-cap="12">Connect</span> <span data-tier="label" data-min-cap="9.5" class="kbd">Enter</span></button><button><span data-tier="minor" data-min-cap="12">Cancel</span> <span data-tier="label" data-min-cap="9.5" class="kbd">Esc</span></button></div></section>
</div>
<script>/* The selected row is scrolled into view, as the product does. */
var r = document.querySelector(".row.sel"); if (r) r.scrollIntoView({ block: "nearest" });</script>
</body>
</html>
