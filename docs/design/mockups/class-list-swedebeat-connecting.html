<div class="app">
<header class="head">
  <div class="title"><h1 data-tier="minor" data-min-cap="28">Classes</h1><span data-tier="minor" data-min-cap="11" class="count">12 classes</span></div>

</header><div class="status"><div class="what"><span class="mark ok" aria-hidden="true"></span><div><span data-tier="minor" data-min-cap="14" class="st">Up to date</span><div><span data-tier="minor" data-min-cap="11" data-lines="2" class="dt">Paired as ana@example.com, “Studio PC”</span></div></div></div></div><div class="status sw"><div class="what"><span class="mark work" aria-hidden="true"></span><div><span data-tier="minor" data-min-cap="14" class="st">Connecting to Swedebeat…</span><div><span data-tier="minor" data-min-cap="11" data-lines="2" class="dt">Your details were sent and have been cleared from this page</span></div></div></div></div><section class="panel"><h2 class="n" data-tier="minor" data-min-cap="28">One moment</h2><p data-tier="minor" data-min-cap="14" data-lines="2">Swedebeat classes can start on the manual clock meanwhile.</p></section>
</div>
<script>/* The selected row is scrolled into view, as the product does. */
var r = document.querySelector(".row.sel"); if (r) r.scrollIntoView({ block: "nearest" });</script>
