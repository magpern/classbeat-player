<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene: the rig (reference mock-up)</title>
<!-- Reference mock-up for docs/design/scene.md. Plain WebGL, no library, no network.
     Fonts and tokens come from the files next to this one. Not product code. -->
<link rel="stylesheet" href="tokens.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--stage); color: var(--light-1); font-family: var(--face-text);
  font-size: var(--t-label); line-height: 1.1; overflow: hidden; cursor: none;
}
body.pointer { cursor: default; }
canvas#rig { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
.n { font-family: var(--face-number); font-weight: 800; }
.lbl { font-size: var(--t-label); font-weight: 400; }
.d { display: inline-block; width: 0.48em; text-align: center; }
.c { display: inline-block; width: 0.22em; text-align: center; }

/* ---- Gel plate: opaque, the zone as number, name and colour ---- */
.gel {
  position: fixed; left: 0; top: 0; width: 24vw; height: 68.4vh; z-index: 2;
  background: var(--zone); color: var(--ink);
  padding: var(--safe-y) 1.5vw 2vh var(--safe-x);
  display: flex; flex-direction: column;
  transition: background-color var(--m-change), color var(--m-change);
}
.gel .lbl { color: var(--ink); font-weight: 700; }
.gel-head { display: flex; align-items: flex-start; gap: 1vw; margin-top: 1vh; }
.gel-num { font-size: 32vh; line-height: 0.8; }
.gel-name { font-size: min(7.6vh, 4.4vw); line-height: 0.95; margin-top: auto; }
.gel-name.long { font-size: var(--t-minor); } /* only a name that cannot fit two lines (S1 step-down) */
.gel-targets { display: flex; flex-wrap: wrap; column-gap: 2vw; margin-top: 1vh; font: 600 var(--t-minor)/1 var(--face-number); }
.gel-targets span { white-space: nowrap; }
.gel.down { background: color-mix(in srgb, var(--zone) 6%, var(--stage)); color: var(--zone); box-shadow: inset -0.5vh 0 0 var(--zone); }
.gel.down .lbl { color: var(--zone); }
.gel.blank { background: var(--light-1); --zone: var(--light-1); }
.edge { position: absolute; right: -0.5vh; top: 0; width: 1vh; height: 100%; background: var(--light-1); opacity: 0; }
.edge.on { opacity: 1; }

/* ---- Text layer over the scene ---- */
.layer { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
.rail { position: absolute; left: 27vw; right: var(--safe-x); top: var(--safe-y); display: flex; align-items: baseline; gap: 1vw; white-space: nowrap; }
.rail .val { font: 600 var(--t-minor)/1 var(--face-number); }
.rail .val + .lbl { margin-right: 2vw; }
.rail .seg { margin-left: auto; }
.link { display: inline-flex; align-items: center; gap: 0.8vw; }
.link::before { content: ""; width: 1.2vh; height: 1.2vh; border-radius: 50%; background: currentColor; }
.link.manual::before { border-radius: 0; }
.plate { background: var(--light-1); color: var(--ink); font-weight: 700; padding: 0.5vh 1vw; border-radius: 0.5vh; }
.plate::before { display: none; }
.metrics { position: absolute; left: 27vw; top: 12vh; display: flex; flex-direction: column; gap: 1.6vh; }
.metric .v { font: 800 7.6vh/0.95 var(--face-number); white-space: nowrap; }
.metric .u { font: 600 var(--t-minor)/1 var(--face-number); margin-left: 0.4vw; }
.beat { display: inline-block; width: 0.22em; height: 0.22em; margin-left: 0.18em; border-radius: 50%; background: var(--light-1); vertical-align: 0.25em; opacity: 0; }
.clock { position: absolute; right: var(--safe-x); top: 10.9vh; text-align: right; }
.chead { display: flex; justify-content: flex-end; align-items: center; gap: 1.2vw; white-space: nowrap; height: 4.2vh; }
.clock .count { font: 800 26vh/0.82 var(--face-number); margin: 1.6vh 0 0 auto; width: fit-content; white-space: nowrap; }
.clock .bars:empty { display: none; }
.clock .count.est { border-bottom: 0.5vh dashed var(--light-1); }
/* 3.8 vh (cap 3.1 %): the head line holds its ink 1 vh clear of the rail above and the countdown below */
.clock .bars { font: 600 3.8vh/1 var(--face-number); }
.clock .bars .w { font-family: var(--face-text); font-weight: 400; font-size: 0.8em; }
/* Compact plates: the paused plate stays inside the 4.2 vh head line, at least 1 vh from the countdown and the rail */
.pplate { display: inline-block; font-size: var(--t-label); line-height: 1; padding: 0.25vh 0.8vw; }
.rail .plate { line-height: 1; padding: 0.15vh 0.8vw; }
.next { margin-top: 1.2vh; }
.nx1 { display: flex; justify-content: flex-end; align-items: baseline; gap: 1vw; font: 600 var(--t-minor)/1.05 var(--face-number); white-space: nowrap; }
.nxc { font: 400 var(--t-label)/1.05 var(--face-text); max-width: 52vw; width: fit-content; margin: 1vh 0 0 auto; text-align: left; }
.chip { background: var(--zone); color: var(--ink); font-weight: 800; padding: 0 0.6vw; border-radius: 0.4vh; }
.next .lbl { font-family: var(--face-text); }
.cue { position: absolute; left: 27vw; right: var(--safe-x); bottom: 31.6vh; font: 700 var(--t-text)/1.06 var(--face-text); }
.cue.long { font-size: var(--t-text-min); }
.title { font: 800 9vh/1 var(--face-number); }

/* ---- Beat-counted position pattern (format 1.1): word, big beat count, beats left ---- */
.pat { position: absolute; left: 46vw; top: 10.9vh; display: none; }
.pat.on { display: block; }
.prow { display: flex; align-items: flex-end; gap: 1vw; margin-top: 1.2vh; }
.pat .pw { font: 800 9vh/0.82 var(--face-number); text-transform: uppercase; white-space: nowrap; }
.pat .pc { font: 800 18vh/0.82 var(--face-number); }
.pat .pc:empty, .pat .pw:empty { display: none; }
.pips { display: flex; flex-wrap: wrap; gap: 0.5vw; margin-top: 1.6vh; align-items: center; white-space: nowrap; }
.prow:empty, .prow.off { display: none; }
/* Fitting: where the block would come within 2 vw of the countdown, the count steps to 14.6 vh (cap 11.9 %) */
.pat.tight .pc { font-size: 14.6vh; } .pat.tight .pw { font-size: 7.4vh; }
.pips i { width: 1.6vh; height: 1.6vh; border: 0.3vh solid var(--light-1); box-sizing: border-box; }
.pips i.on { background: var(--light-1); border-color: var(--light-1); }
.pips .pn { flex-basis: 100%; white-space: normal; font: 400 var(--t-label)/1.1 var(--face-text); margin-top: 0.6vh; }
.cfm { display: inline-block; white-space: normal; max-width: 24vw; font: 400 var(--t-minor)/1.05 var(--face-text); }
.metric .v .pw2 { text-transform: uppercase; }
.metric .v .pc2 { font-size: 13vh; margin-left: 0.5vw; }

/* ---- The score: opaque, flat, 8 minutes ahead ---- */
.score { position: fixed; left: 0; right: 0; top: 70.4vh; bottom: 0; background: var(--stage); z-index: 2; overflow: hidden; border-top: 0.3vh solid var(--stage-line); }
.blk, .clip { position: absolute; top: 0.8vh; height: 10.4vh; overflow: hidden; background: var(--zone); color: var(--ink); will-change: transform; }
.clip { top: 11.8vh; height: 8.6vh; background: var(--stage-raised); color: var(--light-1); }
.blk.past, .blk.sliver { background: var(--stage-line); }
.blk::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--past, 0px); background: rgb(0 0 0 / 0.62); }
.blk.past > *, .blk.sliver > * { visibility: hidden; }
.in { position: absolute; top: 0; padding: 0.9vh 0.6vw 0; white-space: nowrap; }
.l1 { display: flex; align-items: baseline; gap: 0.6vw; }
.l1 .num { font: 800 var(--sc-num)/1 var(--face-number); }
:root { --sc-num: min(5vh, 2.8vw); --sc-len: min(3.72vh, 2.1vw); }
@media (max-aspect-ratio: 3/2) { :root { --sc-num: 5vh; --sc-len: 3.72vh; } }
.l1 .nm, .l1 .len { font-weight: 700; }
.l1 .nm { order: 3; } .l1 .len { order: 2; }
.l1 .len { font-family: var(--face-number); font-weight: 800; font-size: var(--sc-len); }
.l2 { margin-top: 0.6vh; overflow: hidden; text-overflow: ellipsis; font-weight: 400; }
.l2 b { font-weight: 700; }
.pst { position: absolute; left: 0; right: 0; bottom: 0; height: 1vh; }
.clip .in { padding-top: 1vh; }
.clip .ti { font-weight: 700; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: bottom; }
.clip .ar, .clip .bp { color: var(--light-2); margin-left: 1vw; }
.ticks { position: absolute; left: 0; right: 0; bottom: 0; height: 1vh; }
.mom { position: absolute; top: 16.6vh; height: 3.8vh; border-left: 0.4vh solid var(--light-1); padding: 0.1vh 0 0 0.4vw; font-weight: 700; white-space: nowrap; }
.now { position: absolute; top: 0; height: 20.6vh; width: 0.4vh; margin-left: -0.2vh; background: var(--light-1); left: 10vw; z-index: 3; }
.now.est { background: repeating-linear-gradient(var(--light-1) 0 1.2vh, transparent 1.2vh 2vh); }
.mins { position: absolute; top: 21vh; left: 0; right: 0; height: 3.6vh; }
.mins span { position: absolute; color: var(--light-3); white-space: nowrap; }

/* ---- Mock-up panel (not product: the product's control band sits here) ---- */
.panel { position: fixed; left: 0; right: 0; top: 70.4vh; bottom: 0; z-index: 5; background: #0b0b0e; border-top: 0.3vh solid var(--stage-line);
  padding: 1.6vh var(--safe-x); display: none; flex-direction: column; gap: 1vh; font-size: 2.2vh; color: var(--light-2); }
.panel.on { display: flex; }
.panel .row { display: flex; gap: 0.6vw; align-items: center; flex-wrap: wrap; }
.panel .row > b { width: 7vw; color: var(--light-3); font-weight: 400; }
.panel button { font: 700 2.2vh var(--face-text); color: var(--light-1); background: var(--stage-raised); border: 0.2vh solid var(--stage-line); border-radius: 0.6vh; padding: 0.7vh 0.9vw; cursor: pointer; }
.panel button.sel { border-color: var(--light-1); }
.panel .info { margin-left: auto; color: var(--light-3); }

@media (max-aspect-ratio: 3/2) {
  .gel { width: 30vw; height: 48vh; }
  .gel-num { font-size: 28vh; }
  .gel-name { font-size: 7.3vh; }
  .rail { left: 33vw; }
  .rail .seg { display: none; }
  /* Metrics: one row under the countdown (room-2d), so a five-glyph countdown never meets them */
  .metrics { left: 33vw; right: var(--safe-x); top: 39.3vh; flex-direction: row; align-items: baseline; gap: 2.4vw; }
  .metric { display: flex; align-items: baseline; }
  .metric .v { font-size: 7.2vh; }
  /* The units ("rpm", "bpm") and the values ("Seated") carry the meaning: no labels in the row */
  .metric > .lbl { display: none; }
  .metric:nth-child(2) { flex: 1 1 0; min-width: 0; }
  .metric:nth-child(2) .v { white-space: normal; min-width: 0; }
  .cfm { display: block; max-width: none; font: 400 var(--t-label)/1.05 var(--face-text); }
  .next { position: fixed; left: var(--safe-x); right: var(--safe-x); top: 52.5vh; margin: 0; text-align: left; }
  .nx1 { justify-content: flex-start; }
  .nxc { max-width: none; margin-left: 0; }
  .cue { left: var(--safe-x); bottom: 19.7vh; }
  .score, .panel { top: 81vh; }
  .blk { top: 0.5vh; height: 6.6vh; }
  .l2 { display: none; }
  .clip { top: 7.6vh; height: 6.4vh; }
  .clip .in { padding-top: 0.2vh; }
  .mom { top: 10.6vh; height: 3.4vh; padding-top: 0; }
  .now { height: 14vh; }
  /* No minute labels at 3:2 and narrower: the band ends at the 95 vh safe edge */
  .mins { display: none; }
  .pst { height: 0.8vh; }
  .blk .in { padding-top: 0.3vh; }
}
</style>
</head>
<body>
<canvas id="rig"></canvas>

<div class="gel" id="gel">
  <div class="edge" id="edge"></div>
  <div class="gel-head"><span class="gel-num n" id="gNum">1</span><span class="lbl" id="gLbl">Zone</span></div>
  <div class="gel-name n" id="gName">Recovery</div>
  <div class="gel-targets" id="gTg"></div>
</div>

<div class="layer" id="layer">
  <div class="rail">
    <span class="val tx" id="tLeft">24:00</span><span class="lbl tx">left</span>
    <span class="val tx" id="tDone">0:00</span><span class="lbl tx">done</span>
    <span class="seg tx" id="seg">Warm-up</span>
    <span class="link tx" id="link">Following Spotify</span>
  </div>
  <div class="metrics" id="metrics">
    <div class="metric"><div class="lbl tx">Cadence</div><div class="v tx" id="mCad">80–90<span class="u">rpm</span></div></div>
    <div class="metric"><div class="lbl tx" id="mPosL">Position</div><div class="v tx" id="mPos">Seated</div></div>
    <div class="metric"><div class="lbl tx" id="mBpmL">Song</div><div class="v tx" id="mBpm">112<span class="u">bpm</span><span class="beat" id="beat"></span></div></div>
  </div>
  <div class="clock">
    <div class="chead"><span class="lbl tx" id="cLbl">Interval left</span><span class="bars tx" id="bars"></span></div>
    <div class="count n tx" id="count">2:00</div>
    <div class="next" id="next"><div class="nx1 tx" id="nx1"></div><div class="nxc tx" id="nxc"></div></div>
  </div>
  <div class="pat" id="pat">
    <div class="lbl tx" id="pLbl">Pattern</div>
    <div class="prow"><div class="pw tx" id="pWord">Up</div><div class="pc n tx" id="pCount">8</div></div>
    <div class="pips tx" id="pips"></div>
  </div>
  <div class="cue tx" id="cue"></div>
</div>

<div class="score" id="score">
  <div class="now" id="now"></div>
  <div class="mins" id="mins"></div>
</div>

<div class="panel" id="panel">
  <div class="row"><b>Jump</b>
    <button data-j="warm">Warm-up</button><button data-j="z4">Zone 4</button><button data-j="drop">Before a drop (D)</button>
    <button data-j="song">Before a song change (S)</button><button data-j="int">Before an interval change (I)</button><button data-j="z7">Zone 7</button><button data-j="climb">Climb in a song (C)</button><button data-j="jumps">Patterns (J)</button>
    <span class="info" id="info"></span></div>
  <div class="row"><b>State</b>
    <button data-s="running">Running</button><button data-s="paused">Paused</button><button data-s="coasting">Coasting</button>
    <button data-s="offlist">Off the list</button><button data-s="before">Before the start</button><button data-s="finished">Finished</button></div>
  <div class="row"><b>View</b>
    <button data-v="speed">Speed 1×</button><button data-v="rm">Reduced motion: off</button><button data-v="q">Quality: High</button><button data-v="sound">Sound: off</button><button data-v="detail">Music detail: full</button><button data-v="worst">Worst case: off</button>
    <span class="info">Mock-up panel, not product. Keys: Space, ←/→, 1–7, C, J, D, S, I, B, W, M, Q, A, H</span></div>
</div>

<script>
'use strict';
// ---------- The fake class ----------
const ZONES = {
  1: ['Recovery', 'under 55% FTP', 'RPE 1–2'], 2: ['Endurance', '56–75% FTP', 'RPE 3–4'],
  3: ['Tempo', '76–90% FTP', 'RPE 5–6'], 4: ['Threshold', '91–105% FTP', 'RPE 7–8'],
  5: ['VO2 max', '106–120% FTP', 'RPE 8–9'], 6: ['Anaerobic', '121–150% FTP', 'RPE 9'],
  7: ['Sprint', 'over 150% FTP', 'RPE 10'],
};
const SONGS = [
  { ti: 'Morning Static', ar: 'Lumen Drive', a: 0, b: 230, bpm: 112, m: [] },
  { ti: 'Neon Avenue', ar: 'The Night Shift', a: 230, b: 470, bpm: 124, m: [[380, 'build'], [396, 'drop']] },
  { ti: 'Pulse Theory', ar: 'Aurora Lane', a: 470, b: 710, bpm: 132, m: [[600, 'breakdown'], [640, 'drop']] },
  { ti: 'Iron Lungs', ar: 'Kestrel', a: 710, b: 950, bpm: 140, m: [[800, 'drop']] },
  { ti: 'Afterglow Run', ar: 'Signal Fire', a: 950, b: 1200, bpm: 128, m: [[1100, 'drop']] },
  { ti: 'Slow Return', ar: 'Harbour Lights', a: 1200, b: 1440, bpm: 100, m: [] },
];
const UPDN = { Standing: 'up', Seated: 'down' };
// Interval-first: intervals sit on the class clock, several inside one song (climbs), and
// format 1.1 patterns count positions on the song's beat ([8, 8] = 8 up, 8 down).
// position stays required in format 1.1 and equals positions[0]; the pattern wins for a 1.1 reader.
const J88D = { p: ['Standing', 'Seated'], b: [8, 8], on: 'next_downbeat' }, J448 = { p: ['Standing', 'Seated', 'Standing'], b: [4, 4, 8] }, J88 = { p: ['Standing', 'Seated'], b: [8, 8] };
const IV = [
  [0, 120, 1, '80–90', 'Seated', 'Settle in. Shoulders down, find the beat with your feet.'],
  [120, 230, 2, '85–95', 'Seated', 'Add a little load. Breathe through the nose.'],
  [230, 280, 3, '90–100', 'Seated', 'Climb, step 1 of 3: a quarter turn on.'],
  [280, 330, 4, '90–100', 'Seated', 'Climb, step 2 of 3: another quarter turn.'],
  [330, 396, 5, '85–95', 'Seated', 'Step 3 of 3. Heavy and steady, hold it to the drop.'],
  [396, 470, 6, '70–80', 'Standing', 'Jumps on the drop: 8 up, 8 down. Land soft.', J88D],
  [470, 530, 2, '85–95', 'Seated', 'Sit down, spin it out. Drink.'],
  [530, 600, 5, '95–105', 'Seated', 'Push through the verse. A quarter turn each chorus.'],
  [600, 640, 3, '90–100', 'Seated', 'Breakdown: ease off, stay on the beat.'],
  [640, 710, 7, '75–85', 'Standing', 'All in on the drop. Thirty seconds, then twenty more.'],
  [710, 770, 1, '80–90', 'Seated', 'Recover. Big breaths, loose hands.'],
  [770, 800, 4, '90–100', 'Seated', 'Build into it: the drop is coming.'],
  [800, 890, 6, '70–80', 'Standing', 'Jumps: 4 up, 4 down, then 8 up. Stay with the kick drum.', J448],
  [890, 950, 3, '90–100', 'Seated', 'Back to tempo. Smooth circles.'],
  [950, 1000, 4, '90–100', 'Seated', 'Last climb, step 1 of 3.'],
  [1000, 1050, 5, '95–105', 'Seated', 'Step 2 of 3. Heavier.'],
  [1050, 1100, 6, '75–85', 'Standing', 'Step 3 of 3. Out of the saddle, hold for the drop.'],
  [1100, 1160, 7, '80–90', 'Standing', 'Last big effort: 8 up, 8 down on the drop.', J88],
  [1160, 1200, 2, '85–95', 'Seated', 'Spin it out.'],
  [1200, 1440, 1, '75–85', 'Seated', 'Cool down. Thank you, well ridden.'],
].map(([a, b, z, rpm, pos, cue, pat]) => ({ a, b, z, rpm, pos, cue, pat }));
const patTxt = (p) => p.b.map((n, i) => n + ' ' + UPDN[p.p[i]]).join(', ');
const END = 1440;
const LONG_CUE = 'Stay seated and add a quarter turn every chorus; keep the cadence steady, breathe out on the beat, and hold it.';
const WORST_RPM = '100–110';
let WORST_NAME = 'Endurance';
function measureWorstName() {
  const c = document.createElement('canvas').getContext('2d');
  c.font = '800 100px ' + getComputedStyle(document.documentElement).getPropertyValue('--face-number');
  WORST_NAME = Object.values(ZONES).map((z) => z[0]).reduce((a, b) => (c.measureText(b).width > c.measureText(a).width ? b : a));
}
const zName = (z) => (st.worst ? WORST_NAME : ZONES[z][0]);
const zRpm = (iv) => (st.worst ? WORST_RPM : iv.rpm);
const LONG_CUE2 = 'Out of the saddle on the first beat, hands light, hips back; push down on every kick drum and keep going to the end.';
const SEGS = [[0, 230, 'Warm-up'], [230, 1200, 'Main set'], [1200, 1440, 'Cool-down']];
const LOOKS = ['fan', 'cross', 'sweep', 'circle', 'split', 'fan'];
// Energy by zone (scene.md): ambient, lit fixtures, movement, beat lift.
const AMB = [0, .045, .055, .065, .075, .085, .095, .11];
const LIT = [0, 8, 10, 12, 15, 17, 20, 22];
const DEPTH = [0, .15, .18, .22, .27, .32, .38, .45];

// ---------- Helpers ----------
const $ = (id) => document.getElementById(id);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const mmss = (s) => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function lin(hex) { const v = parseInt(hex.slice(1), 16); return [16, 8, 0].map((sh) => { const c = ((v >> sh) & 255) / 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }); }
let ZC = {}; function loadColours() { for (let z = 1; z <= 7; z++) ZC[z] = lin(css('--zone-' + z) || '#ffffff'); ZC.white = lin('#f6f4ef'); }
const songAt = (t) => SONGS.findIndex((s) => t >= s.a && t < s.b);
const ivAt = (t) => IV.findIndex((i) => t >= i.a && t < i.b);
// Music detail the mock-up can take away (plan section 4): 'full', 'noanchors', 'nomoments', 'nobpm'.
// The beat is the song's bpm on a grid from the song's start (the mock-up's stand-in for anchors).
const detail = () => ({ bpm: st.detail !== 'nobpm', anchors: st.detail === 'full' || st.detail === 'nomoments', moments: st.detail !== 'nomoments' });
// Where a pattern stands at time t. start_on 'interval_start' (the default) counts from the
// interval's start at the bpm; 'next_downbeat' needs the anchors (no downbeat is guessed).
function patAt(iv, song, t) {
  if (!iv.pat || !song) return null;
  const p = iv.pat, d = detail();
  if (!d.bpm) return { unknown: 'nobpm' };
  const bl = 60 / song.bpm;
  let s0 = iv.a;
  if (p.on === 'next_downbeat') {
    if (!d.anchors) return { unknown: 'nodownbeat' };
