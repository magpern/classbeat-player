<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings: up to date</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="class-list.css">
<link rel="stylesheet" href="updates.css">
</head>
<body>
<!-- State: "Up to date". Filled circle. The latest version equals the current one. No "Open release page" (absent, not disabled). Both switches at their defaults: Check automatically on, Pre-releases off. Initial focus on Check now. Spec: docs/design/updates.md. Generated by updates-pages.js. -->
<div class="app">
<header class="head">
  <div class="title"><h1 data-tier="minor" data-min-cap="28">Settings</h1></div>
  <button><span data-tier="minor" data-min-cap="12">Back to the classes</span> <span data-tier="label" data-min-cap="9.5" class="kbd">Esc</span></button>
</header>
<main class="settings"><h2 data-tier="minor" data-min-cap="22">Updates</h2>
<div class="s-status" role="status"><div class="what"><span class="mark ok" aria-hidden="true"></span><div><span data-tier="minor" data-min-cap="14" class="st">Up to date</span><div><span data-tier="minor" data-min-cap="11" data-lines="2" class="dt">You have the newest version.</span></div></div></div></div>
<div class="facts"><span data-tier="label" data-min-cap="9.5" class="lbl">Current version</span><span class="v n"><span data-tier="minor" data-min-cap="18">0.1.0</span></span><span data-tier="label" data-min-cap="9.5" class="lbl">Latest version</span><span class="v n"><span data-tier="minor" data-min-cap="18">0.1.0</span></span></div>
<div class="actions"><button><span data-tier="minor" data-min-cap="12">Check now</span></button></div>
<div class="switches"><div class="sw on" role="switch" aria-checked="true" tabindex="0"><div><div><span data-tier="minor" data-min-cap="14" class="nm">Check automatically</span></div><div><span data-tier="minor" data-min-cap="11" data-lines="2" class="hp">At start and every 6 hours while the player is open.</span></div></div><div class="ctl"><span data-tier="minor" data-min-cap="12" class="state">On</span><span class="track" aria-hidden="true"><i></i></span></div></div><div class="sw" role="switch" aria-checked="false" tabindex="0"><div><div><span data-tier="minor" data-min-cap="14" class="nm">Pre-releases</span></div><div><span data-tier="minor" data-min-cap="11" data-lines="2" class="hp">Also tell me about test versions, which come before a normal release.</span></div></div><div class="ctl"><span data-tier="minor" data-min-cap="12" class="state">Off</span><span class="track" aria-hidden="true"><i></i></span></div></div></div></main>
</div>
</body>
</html>
