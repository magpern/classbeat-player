<!-- State: a treadmill (speed, incline) and a foot pod (cadence) connected, all three readings under 3 s old. Numbers only: no gauge, no colour by value. Spec: docs/design/running-class.md. Hand-written from rider-running.html. -->
<main class="run rider"><header class="top"><span class="link"><span class="who-t" data-tier="label" data-clamp="1">Joined as Anna</span></span><span class="ct"><span class="val" data-tier="minor"><span class="d">2</span><span class="d">3</span>:<span class="d">4</span><span class="d">1</span></span><span data-tier="label" data-lines="1">left</span></span></header><section class="gel z4"><span class="gel-num n" data-tier="gel">4</span><div class="gel-txt"><span class="gel-name n" data-tier="value" data-lines="2" data-clamp="2">Threshold</span></div></section><section class="clock"><div class="cl"><span class="lbl"><span data-tier="label" data-lines="1">Interval left</span></span><div class="count n" data-tier="hero"><span class="d">1</span>:<span class="d">1</span><span class="d">0</span></div></div><div class="song"></div></section><section class="effort sens"><div class="m"><span data-tier="label" data-lines="1" class="lbl">Heart rate</span><div class="ev"><span class="n" data-tier="value">157–170</span><span class="u" data-tier="minor">bpm</span></div></div><div class="m"><span data-tier="label" data-lines="1" class="lbl">RPE</span><div class="ev"><span class="n" data-tier="value">7–8</span></div></div><div class="m"><span data-tier="label" data-lines="1" class="lbl">Speed</span><div class="rd line"><span class="n" data-tier="read">9.5</span><span class="u" data-tier="minor">km/h</span></div></div><div class="m"><span data-tier="label" data-lines="1" class="lbl">Incline</span><div class="rd line"><span class="n" data-tier="read">1.0</span><span class="u" data-tier="minor">%</span></div></div><div class="m"><span data-tier="label" data-lines="1" class="lbl">Cadence</span><div class="rd line"><span class="n" data-tier="read">164</span><span class="u" data-tier="minor">steps/min</span></div></div></section><section class="coming fit-P1 fit-L1"><span data-tier="label" data-lines="1" class="lbl">Next</span><div class="next"><span class="chip z2" data-tier="minor">2</span><span class="v nm" data-tier="minor" data-clamp="1">Endurance</span><span class="v dim" data-tier="minor">0:45</span></div><span></span><div class="next"><span class="chip z5" data-tier="minor">5</span><span class="v nm" data-tier="minor" data-clamp="1">VO2 max</span><span class="v dim" data-tier="minor">3:00</span></div><span></span><div class="next"><span class="chip z3" data-tier="minor">3</span><span class="v nm" data-tier="minor" data-clamp="1">Tempo</span><span class="v dim" data-tier="minor">2:00</span></div><span></span></section><nav class="keys two" aria-label="Your numbers and sensors"><button class="key" data-action="my_numbers"><span class="kl" data-tier="minor" data-lines="2">My numbers</span></button><button class="key" data-action="sensors"><span class="kl" data-tier="minor" data-lines="2">Sensors</span></button></nav></main>
</body>
