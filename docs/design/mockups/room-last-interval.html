<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Room screen: last interval</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="room.css">
</head>
<body>
<!-- State: the last interval of the class. Cadence on the beat. -->
<aside class="gel z1">
  <div class="gel-head"><span class="gel-num n" data-tier="gel">1</span><span class="lbl" data-tier="label" data-lines="2">Zone</span></div>
  <span class="gel-name n" data-tier="value" data-lines="2">Recovery</span>
  <div class="gel-targets" data-tier="minor" data-lines="3"><span>50–60% FTP</span><span>RPE 2–3</span></div>
</aside>

<header class="rail">
  <span class="val" data-tier="minor"><span class="d">2</span>:<span class="d">3</span><span class="d">0</span></span><span class="lbl" data-tier="label">left</span>
  <span class="val" data-tier="minor"><span class="d">3</span><span class="d">9</span>:<span class="d">3</span><span class="d">0</span></span><span class="lbl" data-tier="label">done</span>
  <span class="lbl seg" data-tier="label" data-clamp="1">Cool-down</span>
  <span class="link" data-tier="label">Following Spotify</span>
</header>

<section class="clock">
  <span class="lbl" data-tier="label">Last interval</span>
  <div class="count n" data-tier="hero"><span class="d">2</span>:<span class="d">3</span><span class="d">0</span></div>
  <div class="bars" data-tier="minor"><span class="n">93</span> bars to the end</div>
</section>

<section class="metrics">
  <div class="metric"><span class="lbl" data-tier="label">Cadence</span><span class="v n" data-tier="value">On the beat</span></div>
  <div class="metric"><span class="lbl" data-tier="label">Position</span><span class="v n" data-tier="value">Seated</span></div>
  <div class="metric"><span class="lbl" data-tier="label">Song</span><span class="v n" data-tier="value">96<small data-tier="minor">bpm</small><span class="beat" style="--beat:625ms"></span></span></div>
</section>

<p class="cue" data-tier="text" data-lines="4">Long, slow breaths. Let the legs go loose with the music.</p>

<div class="next">
  <span class="lbl" data-tier="label">Next</span>
  <span class="v" data-tier="minor">End of class</span>
</div>

<section class="score">
  <div class="track iv">
    <div class="block gone" style="left:-25.00vw;width:41.67vw"></div>
    <div class="block z1" style="left:16.67vw;width:50.00vw;padding-left:9.13vw"><span class="n" data-tier="minor">1</span><span class="t" data-tier="label" data-fit="hide">Recovery</span></div>
  </div>
  <div class="track songs">
    <div class="clip" style="left:-50.00vw;width:66.67vw;--phrase:2.260vw"></div>
    <div class="clip" style="left:16.67vw;width:50.00vw;--phrase:2.778vw;padding-left:9.13vw"><span class="head"><b data-tier="label" data-clamp="1">Afterglow</b></span><span class="a" data-tier="label" data-fit="hide">Low Tide</span><span class="bpm" data-tier="label" data-fit="hide">96 bpm</span></div>
  </div>
  <div class="end" style="left:66.67vw"><span data-tier="label">End</span></div>
  <div class="past"></div>
  <div class="now"></div>
</section>
</body>
</html>
