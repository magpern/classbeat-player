<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Room screen: join sheet, worst case</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="room.css">
<link rel="stylesheet" href="controls.css">
<link rel="stylesheet" href="join.css">
</head>
<body class="shown">
<!-- Worst case: a 60-character site address (it breaks anywhere rather than being cut) and the new-code plate.  Spec: docs/design/room-join.md. Generated by room-join-pages.js: edit that, not this file. -->
<header class="rail"><span class="lbl seg"></span><span class="link" data-tier="label">Waiting for the first song</span></header><section class="join" aria-label="Join codes">
  <div class="card riders">
    <img class="qr-riders" src="qr-placeholder.svg" alt="QR code to join as a rider: https://classbeat.example/j#KXPD-RMTB">
    <div class="body">
      <h1 data-tier="value">Join the class</h1>
      <span class="plate-new" data-tier="label" role="status">New code</span>
      <p class="how"><span data-tier="minor" data-lines="2">Scan with your phone’s camera.</span></p>
      <div><span class="lbl" data-tier="label">Class code</span><span class="code-big n" data-tier="value">KXPD-RMTB</span></div>
      <div><span class="lbl" data-tier="label">Or open</span><span class="addr" data-tier="minor" data-lines="3">classbeat-studio-network.internal.example.org/j</span></div>
    </div>
  </div>
  <div class="card instr">
    <img class="qr-instr" src="qr-placeholder.svg" alt="QR code for the instructor: https://classbeat.example/control#KXPD-RMTB">
    <div class="itext"><h2 data-tier="minor" data-lines="2">Instructor’s phone</h2>
    <span class="lbl" data-tier="label" data-lines="4">Scan, sign in and steer. It gives no control without your sign-in.</span></div>
  </div>
</section><nav class="controls" aria-label="Class controls"><div class="transport"><button class="btn"><span class="w" data-tier="label">Previous</span><span class="sub" data-tier="label">Interval</span></button><button class="btn main"><span class="w" data-tier="label">Start</span></button><button class="btn"><span class="w" data-tier="label">Next</span><span class="sub" data-tier="label">Interval</span></button></div><div class="code"><div class="code-t"><span class="lbl" data-tier="label">Class code</span><span class="v n" data-tier="minor">KXPD-RMTB</span><span class="dt" data-tier="label">J hides the codes</span></div></div><button class="btn quit"><span class="w" data-tier="label">End</span></button></nav>
</body>
</html>
