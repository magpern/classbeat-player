<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:">
<title>Room</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05050a; color: #fff;
    font-family: system-ui, "Segoe UI", Arial, sans-serif; }
  #scene { position: absolute; inset: 0; }
  #scene canvas { display: block; width: 100%; height: 100%; }
  /* Plain 2D mode: flat panel in the zone colour, no canvas. */
  body.plain { background: var(--zone-dark, #101018); }
  #score2d { position: absolute; left: 0; right: 0; bottom: 0; height: 12vh; display: none; }
  body.plain #score2d { display: flex; }
  #score2d div { box-sizing: border-box; border-right: 2px solid #05050a; opacity: .55; }
  #score2d div.cur { opacity: 1; }
  #text { position: absolute; inset: 0 0 30vh 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-shadow: 0 0 2vh rgba(0,0,0,.9), 0 0 .5vh #000; }
  #zone { font-size: 9vh; line-height: 1; font-weight: 700; letter-spacing: .05em; }
  #name { font-size: 6vh; line-height: 1.2; opacity: .9; }
  #left { font-size: 22vh; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; margin: 1vh 0; }
  #stats { display: flex; gap: 6vw; font-size: 10vh; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
  #next { position: absolute; left: 0; right: 0; bottom: 24vh; text-align: center; font-size: 5vh;
    text-shadow: 0 0 1vh #000; }
  #mode { position: absolute; top: 1vh; right: 1vw; font-size: 2vh; opacity: .5; }
</style>
</head>
<body>
<div id="scene"></div>
<div id="score2d"></div>
<div id="text">
  <div id="zone"></div>
  <div id="name"></div>
  <div id="left">0:00</div>
  <div id="stats"><span id="cadence"></span><span id="bpm"></span></div>
</div>
<div id="next"></div>
<div id="mode"></div>
<script src="room.js"></script>
</body>
</html>
