name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path detection. Lane jobs added later use, for example:
  #   backend:
  #     needs: changes
  #     if: needs.changes.outputs.backend == 'true'
  # and are then added to `needs:` of the `ci` job below. A job skipped by its
  # filter counts as fine there; a failed or cancelled one fails `ci`.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      schema: ${{ steps.detect.outputs.schema }}
      player: ${{ steps.detect.outputs.player }}
      android: ${{ steps.detect.outputs.android }}
      mobile: ${{ steps.detect.outputs.mobile }}
      web: ${{ steps.detect.outputs.web }}
      desktop: ${{ steps.detect.outputs.desktop }}
      code: ${{ steps.detect.outputs.code }}
      scene_spec: ${{ steps.detect.outputs.scene_spec }}
      scene_shots: ${{ steps.detect.outputs.scene_shots }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/detect-changes.sh

  repo-checks:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Repository checks
        run: bash scripts/check-repo.sh
      - name: Provider guard (ADR 0004)
        run: bash scripts/check-providers.sh
      # A change to documentation only (docs/ or a root *.md) runs no tests: the never-commit guard
      # and the provider guard above stay, the script tests, deploy-file tests and shellcheck do not.
      - name: Script tests
        if: needs.changes.outputs.code == 'true'
        run: |
          bash scripts/test-check-repo.sh
          bash scripts/test-check-providers.sh
          bash scripts/test-check-pr-title.sh
          bash scripts/test-detect-changes.sh
          bash scripts/test-worktree.sh
          bash scripts/test-node-packages.sh
          bash scripts/test-build-mac.sh
          bash scripts/test-check-apk-manifest.sh
      # Backend deploy files (issue #95): `docker compose config` with placeholder secret files,
      # the roles, the secrets and the purge scheduler. Reads files only; starts nothing.
      - name: Backend deploy files
        if: needs.changes.outputs.code == 'true'
        run: bash scripts/test-backend-deploy.sh
      - name: shellcheck
        if: needs.changes.outputs.code == 'true'
        run: shellcheck scripts/*.sh docker/*.sh docker/postgres/*.sh

  # Runs `npm ci && npm test` in every package under player/ that has a package.json and a
  # package-lock.json (found by scripts/list-node-packages.sh, never listed by hand).
  # Also runs for a change to docs/design/scene.md, whose tables player/scene/model tests parse (#527).
  # scene/render runs lint, types and unit tests here but not `test:shots`, which takes about 40 minutes
  # and has its own job, `scene-shots` below (#644; scripts/run-node-packages.sh fails if the split drifts).
  node-packages:
    needs: changes
    if: needs.changes.outputs.player == 'true' || needs.changes.outputs.scene_spec == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: found
        run: |
          bash scripts/list-node-packages.sh
          echo "count=$(bash scripts/list-node-packages.sh | wc -l)" >>"$GITHUB_OUTPUT"
      - if: steps.found.outputs.count != '0'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: player/**/package-lock.json
      - if: steps.found.outputs.count != '0'
        name: Install xvfb for Electron packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - name: npm ci and npm test in every package
        run: bash scripts/run-node-packages.sh .
      # Conditioned on the committed screenshot sources (hashFiles is empty when they do not exist
      # yet), so main stays green before #138 lands and the upload then fails CI if no screenshots
      # were produced. always() uploads on red runs too, like room-screenshots-shard-<n>.
      - name: Keep the class list screenshots
        if: always() && hashFiles('player/app/test/shots/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: class-list-screenshots
          path: player/app/screenshots/
          if-no-files-found: error
          retention-days: 14

  # The scene renderer's browser shots (`npm run test:shots`, #644): headless Chrome through SwiftShader
  # on the built demo, about 40 minutes, so it runs beside node-packages instead of inside it. Runs when
  # player/scene/, the tokens and fonts the demo copies in, or the workflow change (scene_shots in
  # scripts/detect-changes.sh). `ci` fails when it did not succeed while scene_shots is true, so a shot
  # that fails, is cancelled or is skipped cannot merge. The runner's own Chrome is used (CHROME_PATH
  # overrides), so there is no browser to download or cache; npm packages are cached by setup-node.
  # The shots are one sequential script that shares one page, so they are not sharded here.
  scene-shots:
    needs: changes
    if: needs.changes.outputs.scene_shots == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: player/scene/render
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: player/scene/render/package-lock.json
      - run: npm ci
      - name: Scene shots and frame log
        run: npm run test:shots
      # The PNGs go to screenshots/ and the frame log to artifacts/ (#544). Only those files are named,
      # so no env file, token or other output can be swept in. always() keeps the failing shots on red runs.
      - name: Keep the scene screenshots and frame log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scene-screenshots
          path: |
            player/scene/render/screenshots/*.png
            player/scene/render/artifacts/frame-log-browser.csv
            player/scene/render/artifacts/frame-log-browser.json
          if-no-files-found: error
          retention-days: 14

  # The desktop app on the three systems it ships for (plan section 12, PL4): lint, types, unit
  # tests, then the e2e test (a display is present on the macOS and Windows runners; Linux runs
  # it under xvfb), then an UNSIGNED package uploaded for a few days. No signing, no secrets.
  # Runs only when player/ changes. The Linux leg overlaps node-packages on purpose: that job
  # covers every package under player/, this one adds the package step.
  desktop-app:
    needs: changes
    if: needs.changes.outputs.player == 'true'
    name: desktop-app (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux }
          - { os: macos-latest, label: macos }
          - { os: windows-latest, label: windows }
    defaults:
      run:
        shell: bash
        working-directory: player/app
    steps:
      # Some unit tests read source files and match them with \n; keep LF on Windows checkouts.
      - name: Keep LF line endings
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: player/app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Install xvfb
        if: matrix.label == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - name: e2e (Linux, under xvfb)
        if: matrix.label == 'linux'
        timeout-minutes: 10
        run: xvfb-run -a npm run test:e2e
      - name: e2e (macOS and Windows)
        if: matrix.label != 'linux'
        timeout-minutes: 10
        run: npm run test:e2e
      - name: Package (unsigned)
        run: bash ../../scripts/package-desktop.sh . "$RUNNER_TEMP/package" ${{ matrix.label }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: classbeat-player-${{ matrix.label }}-unsigned
          path: ${{ runner.temp }}/package/*.tar.gz
          retention-days: 3
          if-no-files-found: error

  # The web lane (screens), in two parts so the long browser checks run side by side (issue #435):
  #  - `web`: web/ci.sh static = lint, types, build, unit tests and the shard check (every spec file
  #    is in exactly one shard of web/spec-shards.txt, so none can be dropped silently).
  #  - `web-specs`: the specs' measurable checks (docs/design/room-2d.md C1 to C9, site.md S1 to S12,
  #    play.md P1 to P10, ...) in the runner's Chrome at every state and size, split over five
  #    runners by web/spec-shards.txt. Concurrency between spec files stays 1 on each runner.
  #    Each shard keeps its screenshots as the artefact room-screenshots-shard-<n> for the Designer.
  # `web` also runs when player/ or schema/ change, but then only the drift test (web/test/unit/
  # snapshot-compat.test.ts, which reads the player's clock and link views and the class types as
  # text), so a change there that the room screen does not follow fails in that pull request.
  # `web-specs` runs only when web/ (or what its checks read) changed; `ci` below fails when it
  # is skipped, failed or cancelled in that case.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.player == 'true' || needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Web checks (lint, types, build, unit tests, shard check)
        if: needs.changes.outputs.web == 'true'
        working-directory: web
        run: bash ci.sh static
      - name: Drift test only (player/ or schema/ changed, web/ did not)
        if: needs.changes.outputs.web != 'true'
        working-directory: web
        run: node --import tsx --test test/unit/snapshot-compat.test.ts

  web-specs:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: web-specs (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Spec checks, shard ${{ matrix.shard }} of 5
        working-directory: web
        run: bash ci.sh shard ${{ matrix.shard }}
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: room-screenshots-shard-${{ matrix.shard }}
          path: web/screenshots/
          if-no-files-found: error
          retention-days: 14

  # Runs schema/ci.sh: install from lockfiles, generated types current, Python and TypeScript
  # checks. A failure fails this job, and `ci` below fails when it fails.
  schema:
    needs: changes
    if: needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: schema/**/uv.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: schema/**/package-lock.json
      - name: Schema checks
        run: bash schema/ci.sh

  # Runs backend/ci.sh against a throwaway PostgreSQL 17 service (the tests drop and create roles
  # and a database on it, so it is never a real server). Skips cleanly while backend/ci.sh does
  # not exist yet. The password is a throwaway for the job's own container, not a secret.
  # The image digest is the current `postgres:17` multi-arch index, from the Docker Hub registry
  # API (HEAD /v2/library/postgres/manifests/17, header Docker-Content-Digest).
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_PASSWORD: ci-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: present
        run: |
          if [ -f backend/ci.sh ]; then
            echo "found=true" >>"$GITHUB_OUTPUT"
          else
            echo "backend/ci.sh does not exist yet; skipping the backend checks"
            echo "found=false" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.present.outputs.found == 'true'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/**/uv.lock
      - if: steps.present.outputs.found == 'true'
        name: Backend checks
        env:
          PLAYER_TEST_DATABASE_URL: postgresql://postgres:ci-throwaway@127.0.0.1:5432/postgres
        run: bash backend/ci.sh

  # The Android spike (player/spikes/android-follower, ADR 0011 section 9; later player/mobile/): the
  # JVM tests, then the debug APK, whose build also runs the merged-manifest check (it fails on any
  # permission, INTERNET included). Uses the JDK 17 and Android SDK preinstalled on the pinned runner
  # image instead of setup actions, so no new third-party action is added (#558). Debug-signed only: no
  # signing secret, no release. The APK is a short-lived test build, never published. No test touches
  # the network; only Gradle, Maven, npm and SDK package downloads happen, during setup.
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: player/scene/render/package-lock.json
      - name: JDK 17 and Android SDK from the runner image
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >>"$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >>"$GITHUB_PATH"
          # compileSdk 35 (app/build.gradle.kts); build tools 34.0.0 is the default of AGP 8.7.3.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"
      - name: Build the scene demo the APK bundles
        working-directory: player/scene/render
        run: |
          npm ci
          npm run build
      - name: Core tests and debug APK (with the manifest check)
        working-directory: player/spikes/android-follower
        run: ./gradlew --no-daemon :core:test :app:assembleDebug
      - name: Keep the debug APK (test build)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-app-debug-TEST-BUILD
          path: player/spikes/android-follower/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

  # The phone and tablet app (player/mobile/, ADR 0011 section 9, #629): the web view's tests, the JVM
  # unit tests of both variants (each reads its variant's merged manifest), the debug and the unsigned
  # release-configured APKs, and a check of the BUILT APKs' manifests (scripts/check-apk-manifest.sh).
  # Runs only for player/mobile/ (and workflow changes, like every lane job). JDK 21 and the Android SDK
  # come from the runner image, so no setup action is added. No device and no emulator. Only npm, Gradle,
  # Maven and SDK package downloads happen, during setup; no test touches the network. The APK is signed
  # with Gradle's throwaway debug key only: there is no signing secret and no release is published.
  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: player/mobile/package-lock.json
      - name: JDK 21 and Android SDK from the runner image
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >>"$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >>"$GITHUB_PATH"
          # compileSdk 36 and AGP 8.13.0's default build tools (app/build.gradle.kts, build.gradle.kts).
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Install, lint, type-check and test the web view (fakes only)
        working-directory: player/mobile
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
      - name: Build the bundled page
        working-directory: player/mobile
        run: npm run build
      - name: JVM unit tests and both APKs
        working-directory: player/mobile/android
        run: ./gradlew --no-daemon testDebugUnitTest testReleaseUnitTest assembleDebug assembleRelease
      - name: Check the built APKs
        run: |
          set -euo pipefail
          out=player/mobile/android/app/build/outputs/apk
          debug="$out/debug/app-debug.apk"
          release="$out/release/app-release-unsigned.apk"
          AAPT2="${ANDROID_HOME}/build-tools/36.0.0/aapt2"
          export AAPT2
          bash scripts/check-apk-manifest.sh debug "$debug"
          bash scripts/check-apk-manifest.sh release "$release"
          # Each check can fail: the same checks run on the wrong build must be refused.
          if bash scripts/check-apk-manifest.sh release "$debug" 2>/dev/null; then
            echo "the debuggable-off check accepted the debug APK" >&2
            exit 1
          fi
          if bash scripts/check-apk-manifest.sh debug "$release" 2>/dev/null; then
            echo "the debuggable-on check accepted the release APK" >&2
            exit 1
          fi
          # The debug APK carries the throwaway debug key and nothing else; the release one is unsigned.
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$debug" | tee /tmp/certs.txt
          grep -q 'CN=Android Debug' /tmp/certs.txt
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$release" 2>/dev/null; then
            echo "the release APK is signed" >&2
            exit 1
          fi
      - name: Keep the debug APK (test build)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-mobile-debug-TEST-BUILD
          path: player/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

  # The single required check. Add lane jobs to `needs` as they appear.
  ci:
    needs: [changes, repo-checks, node-packages, scene-shots, desktop-app, web, web-specs, schema, backend, android, mobile]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any needed job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": "(failure|cancelled)"'; then
            echo "a needed job did not succeed" >&2
            exit 1
          fi
      # A job skipped by its filter is fine, but not the web shards while web changed (issue #435):
      # that would be a web change merged without its spec checks.
      - name: Fail if the web shards did not run when web changed
        env:
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          WEB_SPECS: ${{ needs.web-specs.result }}
        run: |
          if [ "$WEB_CHANGED" = "true" ] && [ "$WEB_SPECS" != "success" ]; then
            echo "web changed but web-specs is '$WEB_SPECS'" >&2
            exit 1
          fi
      # The same for the scene shots (#644): a scene change with no passing shot run cannot be merged.
      - name: Fail if the scene shots did not run when the scene changed
        env:
          SHOTS_CHANGED: ${{ needs.changes.outputs.scene_shots }}
          SHOTS: ${{ needs.scene-shots.result }}
        run: |
          if [ "$SHOTS_CHANGED" = "true" ] && [ "$SHOTS" != "success" ]; then
            echo "the scene changed but scene-shots is '$SHOTS'" >&2
            exit 1
          fi

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check-pr-title.sh "$TITLE"
