name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path detection. Lane jobs added later use, for example:
  #   backend:
  #     needs: changes
  #     if: needs.changes.outputs.backend == 'true'
  # and are then added to `needs:` of the `ci` job below. A job skipped by its
  # filter counts as fine there; a failed or cancelled one fails `ci`.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      schema: ${{ steps.detect.outputs.schema }}
      player: ${{ steps.detect.outputs.player }}
      web: ${{ steps.detect.outputs.web }}
      desktop: ${{ steps.detect.outputs.desktop }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/detect-changes.sh

  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Repository checks
        run: bash scripts/check-repo.sh
      - name: Provider guard (ADR 0004)
        run: bash scripts/check-providers.sh
      - name: Script tests
        run: |
          bash scripts/test-check-repo.sh
          bash scripts/test-check-providers.sh
          bash scripts/test-check-pr-title.sh
          bash scripts/test-detect-changes.sh
          bash scripts/test-worktree.sh
          bash scripts/test-node-packages.sh
          bash scripts/test-build-mac.sh
      # Backend deploy files (issue #95): `docker compose config` with placeholder secret files,
      # the roles, the secrets and the purge scheduler. Reads files only; starts nothing.
      - name: Backend deploy files
        run: bash scripts/test-backend-deploy.sh
      - name: shellcheck
        run: shellcheck scripts/*.sh docker/*.sh docker/postgres/*.sh

  # Runs `npm ci && npm test` in every package under player/ that has a package.json and a
  # package-lock.json (found by scripts/list-node-packages.sh, never listed by hand).
  node-packages:
    needs: changes
    if: needs.changes.outputs.player == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: found
        run: |
          bash scripts/list-node-packages.sh
          echo "count=$(bash scripts/list-node-packages.sh | wc -l)" >>"$GITHUB_OUTPUT"
      - if: steps.found.outputs.count != '0'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: player/**/package-lock.json
      - if: steps.found.outputs.count != '0'
        name: Install xvfb for Electron packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - name: npm ci and npm test in every package
        run: bash scripts/run-node-packages.sh .
      # Conditioned on the committed screenshot sources (hashFiles is empty when they do not exist
      # yet), so main stays green before #138 lands and the upload then fails CI if no screenshots
      # were produced. always() uploads on red runs too, like room-screenshots.
      - name: Keep the class list screenshots
        if: always() && hashFiles('player/app/test/shots/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: class-list-screenshots
          path: player/app/screenshots/
          if-no-files-found: error
          retention-days: 14

  # The desktop app on the three systems it ships for (plan section 12, PL4): lint, types, unit
  # tests, then the e2e test (a display is present on the macOS and Windows runners; Linux runs
  # it under xvfb), then an UNSIGNED package uploaded for a few days. No signing, no secrets.
  # Runs only when player/ changes. The Linux leg overlaps node-packages on purpose: that job
  # covers every package under player/, this one adds the package step.
  desktop-app:
    needs: changes
    if: needs.changes.outputs.player == 'true'
    name: desktop-app (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux }
          - { os: macos-latest, label: macos }
          - { os: windows-latest, label: windows }
    defaults:
      run:
        shell: bash
        working-directory: player/app
    steps:
      # Some unit tests read source files and match them with \n; keep LF on Windows checkouts.
      - name: Keep LF line endings
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: player/app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Install xvfb
        if: matrix.label == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - name: e2e (Linux, under xvfb)
        if: matrix.label == 'linux'
        run: xvfb-run -a npm run test:e2e
      - name: e2e (macOS and Windows)
        if: matrix.label != 'linux'
        run: npm run test:e2e
      - name: Package (unsigned)
        run: bash ../../scripts/package-desktop.sh . "$RUNNER_TEMP/package" ${{ matrix.label }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: classbeat-player-${{ matrix.label }}-unsigned
          path: ${{ runner.temp }}/package/*.tar.gz
          retention-days: 3
          if-no-files-found: error

  # The web lane (screens): web/ci.sh runs lint, types, build, unit tests and the spec's measurable
  # checks (docs/design/room-2d.md C1 to C9) on the real screen in the runner's Chrome at every state
  # and size. The screenshots are kept as an artefact for the Designer.
  # It also runs when player/ or schema/ change, but then only the drift test (web/test/unit/
  # snapshot-compat.test.ts, which reads the player's clock and link views and the class types as
  # text), so a change there that the room screen does not follow fails in that pull request.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.player == 'true' || needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Web checks
        if: needs.changes.outputs.web == 'true'
        working-directory: web
        run: bash ci.sh
      - name: Drift test only (player/ or schema/ changed, web/ did not)
        if: needs.changes.outputs.web != 'true'
        working-directory: web
        run: node --import tsx --test test/unit/snapshot-compat.test.ts
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: room-screenshots
          path: web/screenshots/
          if-no-files-found: ignore
          retention-days: 14

  # Runs schema/ci.sh: install from lockfiles, generated types current, Python and TypeScript
  # checks. A failure fails this job, and `ci` below fails when it fails.
  schema:
    needs: changes
    if: needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: schema/**/uv.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: schema/**/package-lock.json
      - name: Schema checks
        run: bash schema/ci.sh

  # Runs backend/ci.sh against a throwaway PostgreSQL 17 service (the tests drop and create roles
  # and a database on it, so it is never a real server). Skips cleanly while backend/ci.sh does
  # not exist yet. The password is a throwaway for the job's own container, not a secret.
  # The image digest is the current `postgres:17` multi-arch index, from the Docker Hub registry
  # API (HEAD /v2/library/postgres/manifests/17, header Docker-Content-Digest).
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_PASSWORD: ci-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: present
        run: |
          if [ -f backend/ci.sh ]; then
            echo "found=true" >>"$GITHUB_OUTPUT"
          else
            echo "backend/ci.sh does not exist yet; skipping the backend checks"
            echo "found=false" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.present.outputs.found == 'true'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/**/uv.lock
      - if: steps.present.outputs.found == 'true'
        name: Backend checks
        env:
          PLAYER_TEST_DATABASE_URL: postgresql://postgres:ci-throwaway@127.0.0.1:5432/postgres
        run: bash backend/ci.sh

  # The single required check. Add lane jobs to `needs` as they appear.
  ci:
    needs: [changes, repo-checks, node-packages, desktop-app, web, schema, backend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": "(failure|cancelled)"'; then
            echo "a needed job did not succeed" >&2
            exit 1
          fi

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check-pr-title.sh "$TITLE"
