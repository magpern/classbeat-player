name: release-player

# The desktop player release (issue #760, plan PL7): UNSIGNED builds for macOS (arm64 and x64),
# Windows x64 and Linux x64, uploaded with SHA256SUMS to a GitHub Release with generated notes.
#  - A tag `player-vX.Y.Z` (SemVer; a pre-release has a hyphen part) pushed on a commit of main
#    publishes. The tag is checked (SemVer, on main) before anything is built.
#  - workflow_dispatch with dry_run (the default) builds every target and writes SHA256SUMS but
#    publishes nothing; dry_run false publishes only when it is run on a player-v tag.
#  - A pull request that changes this workflow or its scripts runs the same dry run.
# Desktop signing and notarisation wait for the owner (docs/owner.md: Apple Developer membership and
# a Windows signing identity, plan decision 9): the desktop builds are unsigned and the notes say so.
# The Android APK (#849): android-build builds and checks it, alignment included, with no secret;
# android-sign (the only job with a secret, only on a publishing tag) signs it; publish-android
# attaches it. `gh release create --verify-tag` never creates a tag; none is moved or deleted.
# Checks of this file: scripts/test-release-player.sh (run by the verify job below).

on:
  push:
    tags: ["player-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build every target and write SHA256SUMS without publishing
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/release-player.yml
      - scripts/check-release-tag.sh
      - scripts/release-player-assets.sh
      - scripts/site-releases-json.mjs
      - scripts/test-site-releases-json.mjs
      - scripts/fixtures/site-releases/**
      - scripts/test-release-player.sh
      - scripts/package-desktop.sh
      - scripts/sign-android-apk.sh
      - scripts/test-sign-android-apk.sh
      - scripts/check-apk-manifest.sh

permissions:
  contents: read

concurrency:
  group: release-player-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether this run publishes and checks the tag. A tag that is not SemVer or not on main
  # fails here, so no build starts.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      version: ${{ steps.mode.outputs.version }}
      prerelease: ${{ steps.mode.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Release script tests
        run: |
          bash scripts/test-release-player.sh
          bash scripts/test-sign-android-apk.sh
      - id: mode
        name: Check the tag and decide whether to publish
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          publish=false
          if [ "$EVENT" = push ] || { [ "$EVENT" = workflow_dispatch ] && [ "$DRY_RUN" = false ]; }; then
            publish=true
          fi
          if [ "$publish" = true ] && [ "$REF_TYPE" != tag ]; then
            echo "publishing needs a player-v tag; this run is on a $REF_TYPE" >&2
            exit 1
          fi
          if [ "$REF_TYPE" = tag ]; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            bash scripts/check-release-tag.sh "$TAG" "$COMMIT" refs/remotes/origin/main
          else
            echo "version=dry-run-${COMMIT:0:12}" >>"$GITHUB_OUTPUT"
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
          fi
          echo "publish=$publish" >>"$GITHUB_OUTPUT"
          echo "publish: $publish"

  # The same build steps as the desktop-app job in ci.yml (npm ci, build, scripts/package-desktop.sh),
  # on one runner per target. No npm cache, so a release is built only from the lockfile's packages.
  build:
    needs: verify
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux-x64, arch: x64 }
          - { os: macos-latest, label: macos-arm64, arch: arm64 }
          - { os: macos-15-intel, label: macos-x64, arch: x64 }
          - { os: windows-latest, label: windows-x64, arch: x64 }
    defaults:
      run:
        shell: bash
        working-directory: player/app
    steps:
      - name: Keep LF line endings
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Check the runner's CPU matches the target
        env:
          WANT: ${{ matrix.arch }}
        run: |
          got="$(node -p process.arch)"
          [ "$got" = "$WANT" ] || { echo "runner is $got, target needs $WANT" >&2; exit 1; }
      - run: npm ci
      # npm ci does not fetch the Electron runtime here (the electron package runs no install script
      # under this npm; in ci.yml the e2e test fetches it on first launch). Run Electron's own
      # install.js, the version pinned in the lockfile, as scripts/build-mac.sh does.
      - name: Fetch the Electron runtime
        run: |
          if [ ! -d node_modules/electron/dist ]; then node node_modules/electron/install.js; fi
          [ -d node_modules/electron/dist ] || { echo "no Electron runtime after install.js" >&2; exit 1; }
      - run: npm run build
      # Signing and notarisation will be added here once the owner provides the signing identities
      # (docs/owner.md). Until then the package is unsigned and the release notes say so.
      - name: Package (unsigned)
        env:
          LABEL: ${{ matrix.label }}
        run: bash ../../scripts/package-desktop.sh . "$RUNNER_TEMP/package" "$LABEL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-player-${{ matrix.label }}
          path: ${{ runner.temp }}/package/*.tar.gz
          retention-days: 3
          if-no-files-found: error

  # Collects every archive, writes SHA256SUMS and the release notes, and keeps them as one artifact.
  # Runs on a dry run too, so the dry run proves the whole set is built.
  checksums:
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # The four build artifacts (release-player-<system>-<cpu>), not release-player-assets. The
      # assets script below fails on a missing archive or any other file.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-player-*-*
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - name: SHA256SUMS and release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PUBLISH: ${{ needs.verify.outputs.publish }}
        run: |
          set -euo pipefail
          bash scripts/release-player-assets.sh "$RUNNER_TEMP/assets" "$VERSION"
          cat "$RUNNER_TEMP/assets/SHA256SUMS"
          {
            echo "## Desktop player $VERSION (publish: $PUBLISH)"
            echo
            echo '```'
            cat "$RUNNER_TEMP/assets/SHA256SUMS"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-player-assets
          path: |
            ${{ runner.temp }}/assets/*.tar.gz
            ${{ runner.temp }}/assets/SHA256SUMS
            ${{ runner.temp }}/assets/RELEASE_NOTES.md
          retention-days: 7
          if-no-files-found: error

  # The Android phone and tablet app (#849, ADR 0011 section 9): the same build as the mobile job in
  # ci.yml (npm ci, the bundled page, Gradle assembleRelease), then the release manifest check on the
  # built APK. No secret here: the APK is unsigned and is handed to android-sign as an artifact. Runs on
  # a dry run and a pull request too, so they prove the APK builds.
  android-build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: JDK 21 and Android SDK from the runner image
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >>"$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >>"$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build the bundled page
        working-directory: player/mobile
        run: |
          npm ci
          npm run build
      - name: Release APK (unsigned)
        working-directory: player/mobile/android
        run: ./gradlew --no-daemon assembleRelease
      - name: Check the built APK
        run: |
          set -euo pipefail
          apk=player/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2" bash scripts/check-apk-manifest.sh release "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c 4 "$apk"
          mkdir -p "$RUNNER_TEMP/android"
          cp "$apk" "$RUNNER_TEMP/android/classbeat-player-android-unsigned.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-unsigned
          path: ${{ runner.temp }}/android/classbeat-player-android-unsigned.apk
          retention-days: 3
          if-no-files-found: error

  # Signs the APK with the project key (scripts/sign-android-apk.sh: apksigner, v2 and v3, verified
  # with --print-certs against the pinned certificate). The only job that sees the signing secrets, and
  # only when this run publishes from a player-v tag: never a pull request, never a dry run. A fresh
  # runner that runs no npm or Gradle, so no dependency's install script runs beside the key. The
  # secrets reach the one signing step through env: only. A missing secret fails this job by name, and
  # the Android jobs only: the desktop release does not wait for them, so nothing unsigned is uploaded.
  android-sign:
    needs: [verify, android-build]
    if: needs.verify.outputs.publish == 'true' && github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/player-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Android build tools from the runner image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-release-unsigned
          path: ${{ runner.temp }}/unsigned
      # The certificate of ADR 0011 section 9's temporary key (owner, 2026-11-26); a new key changes it here.
      - name: Sign and verify
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_CERT_SHA256: "10:3E:E1:B1:0D:73:44:25:AB:C6:7A:74:14:B3:06:F2:D2:EE:DD:EA:7E:A6:A6:6C:0D:A6:DF:35:D0:9B:DC:CA"
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p "$RUNNER_TEMP/android"
          APKSIGNER="$tools/apksigner" ZIPALIGN="$tools/zipalign" SIGN_DIR="$RUNNER_TEMP/android-signing" \
            bash scripts/sign-android-apk.sh "$RUNNER_TEMP/unsigned/classbeat-player-android-unsigned.apk" \
            "$RUNNER_TEMP/android/classbeat-player-android.apk"
      - name: Remove the keystore
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/android-signing"
      - name: Check the signed APK and write SHA256SUMS-android
        run: |
          set -euo pipefail
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2" \
            bash scripts/check-apk-manifest.sh release "$RUNNER_TEMP/android/classbeat-player-android.apk"
          cd "$RUNNER_TEMP/android"
          sha256sum classbeat-player-android.apk >SHA256SUMS-android
          cat SHA256SUMS-android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-signed
          path: |
            ${{ runner.temp }}/android/classbeat-player-android.apk
            ${{ runner.temp }}/android/SHA256SUMS-android
          retention-days: 7
          if-no-files-found: error

  # The only job that can write, and only for a player-v tag that verify accepted. Never on a pull
  # request. It checks the archives against SHA256SUMS and that the tag has not moved since the
  # build (issue #783). `--verify-tag` makes gh refuse rather than create a tag; an existing
  # release is never replaced (gh fails instead).
  publish:
    needs: [verify, checksums]
    if: needs.verify.outputs.publish == 'true' && github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/player-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-player-assets
          path: assets
      # The archives uploaded below are exactly the ones checksums listed, unchanged since then: every
      # line of SHA256SUMS matches its file, and every archive here has a line.
      - name: Check the archives against SHA256SUMS
        working-directory: assets
        run: |
          set -euo pipefail
          sha256sum -c --strict SHA256SUMS
          for f in ./*.tar.gz; do
            awk -v f="${f#./}" '$2 == f || $2 == "*" f { found = 1 } END { exit !found }' SHA256SUMS ||
              { echo "archive not in SHA256SUMS: $f" >&2; exit 1; }
          done
      # The tag must still point at the commit that was verified and built. A tag moved (or deleted)
      # since the push fails the job here, before anything is published. Read-only and anonymous:
      # the repository is public, and if it ever is not, ls-remote fails and so does the job.
      - name: Check the remote tag still points at the built commit
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          refs="$(git ls-remote "$REPO_URL" "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          # An annotated tag lists the tag object and its commit (^{}); a lightweight tag only the commit.
          remote="$(awk -v r="refs/tags/$TAG^{}" '$2 == r { print $1 }' <<<"$refs")"
          if [ -z "$remote" ]; then
            remote="$(awk -v r="refs/tags/$TAG" '$2 == r { print $1 }' <<<"$refs")"
          fi
          if [ "$remote" != "$COMMIT" ]; then
            echo "tag $TAG points at '${remote:-nothing}', not the built commit $COMMIT" >&2
            exit 1
          fi
          echo "tag $TAG still points at $COMMIT"
      - name: Create the GitHub Release
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "classbeat player $VERSION" \
            --notes-file RELEASE_NOTES.md --generate-notes "${flags[@]}" \
            ./*.tar.gz SHA256SUMS
      # The download page's data (issue #793): after the release is published, the site's
      # releases.json is rebuilt from the published releases and their SHA256SUMS (the latest by
      # docs/design/download.md, not necessarily this tag) and proposed as a pull request on a
      # branch of its own, never pushed to main. No change, no pull request. The pull request is
      # reviewed and merged like any other. Reads and writes go through the REST API only.
      - name: Open a pull request with the site's releases.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          file=web/src/site/releases.json
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" | jq 'add // []' >"$RUNNER_TEMP/releases.json"
          latest="$(node scripts/site-releases-json.mjs tag "$RUNNER_TEMP/releases.json")"
          sums="$RUNNER_TEMP/SHA256SUMS"
          if [ -n "$latest" ]; then
            gh release download "$latest" --pattern SHA256SUMS --output "$sums"
          else
            : >"$sums"
          fi
          node scripts/site-releases-json.mjs build "$RUNNER_TEMP/releases.json" "$sums" "$RUNNER_TEMP/site-releases.json"
          if cmp -s "$RUNNER_TEMP/site-releases.json" "$file"; then
            echo "the site's releases.json already matches the latest release"
            exit 0
          fi
          branch="site-releases-$TAG"
          main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          file_sha="$(gh api "repos/$GH_REPO/contents/$file?ref=main" --jq .sha)"
          gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$main_sha" >/dev/null
          gh api -X PUT "repos/$GH_REPO/contents/$file" -f message="chore(screens): site releases.json for $latest" \
            -f branch="$branch" -f sha="$file_sha" -f content="$(base64 -w0 "$RUNNER_TEMP/site-releases.json")" >/dev/null
          gh api -X POST "repos/$GH_REPO/pulls" -f title="chore(screens): site releases.json for $latest" \
            -f head="$branch" -f base=main \
            -f body="Written by scripts/site-releases-json.mjs from the published releases and SHA256SUMS of $latest (issue #793). Only web/src/site/releases.json changes." >/dev/null

  # Attaches the signed APK and SHA256SUMS-android to the release publish created, after checking the
  # APK against them. Same guard as publish; never replaces an asset (gh fails instead).
  publish-android:
    needs: [verify, publish, android-sign]
    if: needs.verify.outputs.publish == 'true' && github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/player-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-release-signed
          path: android
      - name: Attach the signed APK
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha256sum -c --strict SHA256SUMS-android
          [ "$(awk '{ print $2 }' SHA256SUMS-android)" = classbeat-player-android.apk ] ||
            { echo "SHA256SUMS-android must list exactly classbeat-player-android.apk" >&2; exit 1; }
          gh release upload "$TAG" classbeat-player-android.apk SHA256SUMS-android
